name: Build Moonshine Luigi's Mansion launcher

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: GLMJ01 bootstrap launcher
    # The bundled devkitPro toolchain is Windows-specific.  Pin the runner so
    # its pre-installed CMake/Ninja versions cannot change unexpectedly.
    runs-on: windows-2022

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version

      - name: Install build dependencies
        run: python setup_venv.py

      - name: Configure console build
        run: cmake --preset release_console

      - name: Build launcher
        run: cmake --build --preset console

      - name: Upload launcher to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "build/moonshine_luigis_mansion_launcher.zip" --clobber
