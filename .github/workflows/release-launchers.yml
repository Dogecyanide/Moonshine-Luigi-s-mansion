name: Build release launcher

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: launcher
    # The bundled devkitPro toolchain is Windows-specific.  Pin the runner so
    # its pre-installed CMake/Ninja versions cannot change unexpectedly.
    runs-on: windows-2022

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version

      - name: Install build dependencies
        run: python setup_venv.py

      # One launcher serves all three discs now, so this is a single job rather
      # than a region matrix; the preset sets VERS to all three, which is what
      # decides the mod_<region>.bin files bundled into the app.
      - name: Configure console build
        run: cmake --preset release_console

      - name: Build launcher
        run: cmake --build --preset console

      - name: Upload launcher to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "build/susamune_launcher.zip" --clobber
